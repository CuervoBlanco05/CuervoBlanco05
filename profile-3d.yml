name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # 18:00 UTC = 11:00 en Mazatlán. Se regenera una vez al día.
    - cron: "0 18 * * *"
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

# SIN ESTO EL WORKFLOW FALLA AL HACER PUSH.
# Es el error nº1 de quien sigue tutoriales viejos que no lo incluyen.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: regenerate 3D contribution graph" || exit 0
          git push
